<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 78px;
      font-weight: 900;
      letter-spacing: 4px;
      fill: #0f172a;
      text-anchor: middle;
      dominant-baseline: middle;
      animation: pulseGlowLight 4s ease-in-out infinite;
    }
    .glitch-1 {
      fill: #0284c7;
      animation: glitchAnim1 3s infinite linear alternate-reverse;
      opacity: 0.8;
      transform: translate(-3px, 1px);
    }
    .glitch-2 {
      fill: #e11d48;
      animation: glitchAnim2 2.5s infinite linear alternate-reverse;
      opacity: 0.8;
      transform: translate(3px, -1px);
    }
    @keyframes pulseGlowLight {
      0%, 100% { text-shadow: 0 0 10px rgba(2,132,199,0.25); }
      50% { text-shadow: 0 0 25px rgba(2,132,199,0.55), 0 0 40px rgba(225,29,72,0.3); }
    }
    @keyframes glitchAnim1 {
      0% { clip-path: inset(20% 0 80% 0); transform: translate(-4px, 2px); }
      5% { clip-path: inset(50% 0 30% 0); transform: translate(4px, -2px); }
      10% { clip-path: inset(10% 0 50% 0); transform: translate(-4px, 2px); }
      15% { clip-path: inset(80% 0 5% 0); transform: translate(4px, -2px); }
      20%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    }
    @keyframes glitchAnim2 {
      0% { clip-path: inset(10% 0 60% 0); transform: translate(4px, -2px); }
      5% { clip-path: inset(40% 0 40% 0); transform: translate(-4px, 2px); }
      10% { clip-path: inset(80% 0 5% 0); transform: translate(4px, -2px); }
      15% { clip-path: inset(5% 0 80% 0); transform: translate(-4px, 2px); }
      20%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    }
    .ripple-circle {
      transform-origin: 50% 100px;
      animation: rippleShape 3.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .ripple-circle:nth-child(2) {
      animation-delay: 1.6s;
    }
    @keyframes rippleShape {
      0% { transform: scale(0.85); opacity: 0.3; }
      100% { transform: scale(1.45); opacity: 0; }
    }
  </style>
  
  <ellipse cx="50%" cy="100" rx="360" ry="24" fill="none" stroke="#0284c7" stroke-width="1.2" class="ripple-circle" />
  <ellipse cx="50%" cy="100" rx="360" ry="24" fill="none" stroke="#e11d48" stroke-width="1.2" class="ripple-circle" />
  
  <text x="50%" y="100" class="title glitch-1">SYNTHID-STRIPPER</text>
  <text x="50%" y="100" class="title glitch-2">SYNTHID-STRIPPER</text>
  <text x="50%" y="100" class="title">SYNTHID-STRIPPER</text>
</svg>
