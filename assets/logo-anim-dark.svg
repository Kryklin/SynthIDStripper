<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan Glitch Filter -->
    <filter id="glitchCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#00f0ff" result="flood" />
      <feComposite in="flood" in2="SourceAlpha" operator="in" result="cyanColored" />
      <feGaussianBlur in="cyanColored" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="cyanColored" />
      </feMerge>
    </filter>

    <!-- Magenta Glitch Filter -->
    <filter id="glitchMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#ff0077" result="flood" />
      <feComposite in="flood" in2="SourceAlpha" operator="in" result="magentaColored" />
      <feGaussianBlur in="magentaColored" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="magentaColored" />
      </feMerge>
    </filter>

    <!-- Ambient Aura Glow Filter -->
    <filter id="shieldAura" x="-40%" y="-40%" width="180%" height="180%">
      <feFlood flood-color="#00e5ff" result="flood" />
      <feComposite in="flood" in2="SourceAlpha" operator="in" result="colorMask" />
      <feGaussianBlur in="colorMask" stdDeviation="25" result="aura" />
      <feComponentTransfer in="aura" result="dimAura">
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimAura" />
      </feMerge>
    </filter>

    <!-- Linear Gradient for Laser Scanline -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="85%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gradient for Shield Base -->
    <linearGradient id="shieldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#050a12" />
      <stop offset="100%" stop-color="#03070d" />
    </linearGradient>

    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff0077" />
    </linearGradient>

    <!-- Shield Path Definition -->
    <g id="shieldArtDark">
      <!-- Outer Shield Outline -->
      <path d="M250 45 L395 110 L395 260 Q395 385 250 455 Q105 385 105 260 L105 110 Z" 
            fill="url(#shieldGradDark)" stroke="url(#neonStroke)" stroke-width="6" stroke-linejoin="round" />
      <!-- Inner Cyber Inset -->
      <path d="M250 70 L370 124 L370 250 Q370 355 250 422 Q130 355 130 250 L130 124 Z" 
            fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.6" />
      <!-- Stylized S Prism Nullifier Core -->
      <path d="M315 160 C315 160 210 160 190 195 C170 230 220 245 250 250 C310 260 330 290 310 325 C285 365 180 345 180 345 M170 335 L170 355 M325 150 L325 170" 
            fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Core Crystal Energy Beam -->
      <line x1="160" y1="250" x2="340" y2="250" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />
      <circle cx="250" cy="250" r="16" fill="#00f0ff" />
      <circle cx="250" cy="250" r="8" fill="#ffffff" />
      <!-- Tech Grid Nodes -->
      <circle cx="250" cy="115" r="4" fill="#ff0077" />
      <circle cx="340" cy="180" r="3.5" fill="#00f0ff" />
      <circle cx="160" cy="180" r="3.5" fill="#00f0ff" />
      <circle cx="340" cy="320" r="3.5" fill="#00f0ff" />
      <circle cx="160" cy="320" r="3.5" fill="#00f0ff" />
      <circle cx="250" cy="390" r="4" fill="#00f0ff" />
    </g>

    <!-- Clip Mask for Laser Scanline -->
    <mask id="shieldMask">
      <path d="M250 45 L395 110 L395 260 Q395 385 250 455 Q105 385 105 260 L105 110 Z" fill="#ffffff" />
    </mask>
  </defs>

  <style>
    /* Aura Breathing Pulse */
    .aura-bg {
      transform-origin: center;
      animation: auraPulse 4s ease-in-out infinite;
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }

    /* Core Floating Levitation */
    .shield-core {
      transform-origin: center;
      animation: shieldFloat 5s ease-in-out infinite;
    }
    @keyframes shieldFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    /* Glitch Overlays */
    .glitch-cyan {
      transform-origin: center;
      opacity: 0;
      animation: cyanGlitch 4.5s infinite ease-in-out;
    }
    @keyframes cyanGlitch {
      0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
      87% { opacity: 0.85; transform: translate(-6px, 2px); clip-path: inset(18% 0 68% 0); }
      88% { opacity: 0.9; transform: translate(4px, -3px); clip-path: inset(52% 0 32% 0); }
      89% { opacity: 0.6; transform: translate(-4px, 3px); clip-path: inset(80% 0 6% 0); }
      90% { opacity: 0; transform: translate(0, 0); }
      94% { opacity: 0.8; transform: translate(5px, -2px); clip-path: inset(35% 0 50% 0); }
      95% { opacity: 0; transform: translate(0, 0); }
    }

    .glitch-magenta {
      transform-origin: center;
      opacity: 0;
      animation: magentaGlitch 4.5s infinite ease-in-out;
    }
    @keyframes magentaGlitch {
      0%, 87%, 100% { opacity: 0; transform: translate(0, 0); }
      88% { opacity: 0.85; transform: translate(5px, -2px); clip-path: inset(25% 0 60% 0); }
      89% { opacity: 0.9; transform: translate(-5px, 2px); clip-path: inset(60% 0 25% 0); }
      90% { opacity: 0.7; transform: translate(3px, -2px); clip-path: inset(75% 0 10% 0); }
      91% { opacity: 0; transform: translate(0, 0); }
      95% { opacity: 0.8; transform: translate(-4px, 2px); clip-path: inset(40% 0 45% 0); }
      96% { opacity: 0; transform: translate(0, 0); }
    }

    /* Laser Scanline Beam */
    .scanline-beam {
      animation: scanAnim 3.8s linear infinite;
    }
    @keyframes scanAnim {
      0% { transform: translateY(-120px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(480px); opacity: 0; }
    }
  </style>

  <!-- Aura Glow Layer -->
  <g class="aura-bg" filter="url(#shieldAura)">
    <use href="#shieldArtDark" />
  </g>

  <!-- Main Levitating Shield -->
  <g class="shield-core">
    <!-- Glitch Sub-Layers -->
    <g class="glitch-cyan" filter="url(#glitchCyan)">
      <use href="#shieldArtDark" />
    </g>
    <g class="glitch-magenta" filter="url(#glitchMagenta)">
      <use href="#shieldArtDark" />
    </g>

    <!-- Crisp Primary Shield -->
    <use href="#shieldArtDark" />

    <!-- Laser Scanline sweeping over the shield -->
    <g mask="url(#shieldMask)">
      <rect class="scanline-beam" x="90" y="30" width="320" height="45" fill="url(#scanBeam)" />
    </g>
  </g>
</svg>
